[workspace]
resolver = "2"
members = [
    "crates/fountain",
    "crates/document",
    "crates/layout",
    "crates/render_pdf",
    "crates/storage",
    "crates/spell",
    "crates/bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-or-later"
publish = false

# Every entry here needs a one-line justification in docs/DEPENDENCIES.md.
[workspace.dependencies]
screenplay_fountain = { path = "crates/fountain" }
screenplay_document = { path = "crates/document" }
screenplay_layout = { path = "crates/layout" }
screenplay_render_pdf = { path = "crates/render_pdf" }
screenplay_storage = { path = "crates/storage" }
screenplay_spell = { path = "crates/spell" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"  # FRB translates Rust panics into Dart exceptions; abort would kill the app.
strip = "symbols"

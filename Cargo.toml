[workspace]
resolver = "2"
members = [
    "crates/fountain",
    "crates/fdx",
    "crates/document",
    "crates/layout",
    "crates/render_pdf",
    "crates/storage",
    "crates/spell",
    "crates/bridge",
]

[workspace.package]
# The release version is `app/pubspec.yaml`'s — this is the same number written
# a second time, because Cargo cannot read it from there. `tools/check_version.py`
# fails the build if the two ever disagree, which is the only thing that makes
# "one source" true rather than aspirational.
version = "1.0.2"
edition = "2021"
# Not aspirational, and not a preference: this is the floor the resolved
# dependency graph actually needs, and CI's `msrv` job builds on exactly this
# toolchain. `hashbrown` (under `spellbook`) and `notify-types` (under `notify`)
# are what set it, so lowering it means replacing one of those two — see their
# lines in `docs/DEPENDENCIES.md`. It said 1.82 until those two moved and
# nothing noticed, which is why the job exists.
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false

# Every entry here needs a one-line justification in docs/DEPENDENCIES.md.
[workspace.dependencies]
slugline_fountain = { path = "crates/fountain" }
slugline_fdx = { path = "crates/fdx" }
quick-xml = { version = "=0.38.3", default-features = false }
slugline_document = { path = "crates/document" }
slugline_layout = { path = "crates/layout" }
slugline_render_pdf = { path = "crates/render_pdf" }
slugline_storage = { path = "crates/storage" }
slugline_spell = { path = "crates/spell" }

# Test-only. Both are named in the spec's testing strategy (§13); criterion runs
# with default features off so that plotters and its tree stay out of the build.
proptest = "1"
criterion = { version = "0.5", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"  # FRB translates Rust panics into Dart exceptions; abort would kill the app.
strip = "symbols"

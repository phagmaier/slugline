[package]
name = "slugline_bridge"
version.workspace = true
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
slugline_fountain.workspace = true
slugline_fdx.workspace = true
slugline_document.workspace = true
slugline_layout.workspace = true
slugline_render_pdf.workspace = true
slugline_spell.workspace = true
slugline_storage.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

name: Release

on:
  push:
    tags:
      - 'v*'

# The built-in GITHUB_TOKEN is sufficient to create and update this tag's
# release. No personal access token or repository secret is required.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  release:
    name: Verify, package, and publish Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read and verify the release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tools/release_version.sh)"
          expected_tag="v$version"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $expected_tag." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$expected_tag" >> "$GITHUB_OUTPUT"

      - name: Install Linux build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            appstream binutils clang cmake curl desktop-file-utils file \
            libgtk-3-dev liblzma-dev libxml2-utils ninja-build \
            pkg-config poppler-utils shellcheck xvfb

      - name: Install stable Rust with formatting and lint components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Rust caches
        uses: Swatinem/rust-cache@v2

      - name: Install the project-supported Flutter toolchain
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          # Exact pin — see the note on the CI flutter job's setup step.
          flutter-version: "3.44.8"
          cache: true
          pub-cache: true

      # What ships is built from the committed lockfile or not at all — see
      # the note on the CI flutter job's resolve step.
      - name: Resolve Flutter packages
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Resolve vendored Cargokit build-tool packages
        working-directory: app/rust_builder/cargokit/build_tool
        run: dart pub get

      - name: Verify version consistency
        run: python3 tools/check_version.py

      - name: Verify crate layering
        run: python3 tools/check_layering.py

      - name: Verify the generated reference feature
        run: python3 tools/make_reference.py --check

      - name: Validate shell syntax and style
        run: |
          bash -n tools/*.sh
          shellcheck tools/*.sh

      - name: Validate desktop, AppStream, and MIME metadata
        run: |
          desktop-file-validate packaging/com.phagmaier.slugline.desktop
          appstreamcli validate --no-net packaging/com.phagmaier.slugline.metainfo.xml
          xmllint --noout packaging/com.phagmaier.slugline.mime.xml

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Mount a small filesystem for the full-disk test
        run: |
          sudo mkdir -p /mnt/slugline-full-disk
          sudo mount -t tmpfs -o size=4m,mode=1777 tmpfs /mnt/slugline-full-disk

      - name: Run Rust tests
        env:
          SLUGLINE_FULL_DISK_DIR: /mnt/slugline-full-disk
        run: cargo test --workspace

      - name: Unmount the full-disk test filesystem
        if: always()
        run: sudo umount /mnt/slugline-full-disk || true

      - name: Run Flutter analysis
        working-directory: app
        run: flutter analyze

      - name: Run Flutter unit tests
        working-directory: app
        run: flutter test

      - name: Run Flutter Linux integration tests under Xvfb
        run: ./tools/test_linux_integration.sh

      - name: Build the versioned release tarball
        run: tools/package.sh

      - name: Verify stripped binaries and bundled Rust bridge
        run: |
          test -f app/build/linux/x64/release/bundle/lib/libslugline_bridge.so
          for binary in \
            app/build/linux/x64/release/bundle/slugline \
            app/build/linux/x64/release/bundle/lib/libslugline_bridge.so; do
            if file "$binary" | grep -q 'not stripped'; then
              echo "$binary is not stripped" >&2
              exit 1
            fi
          done

      - name: Run the no-network verification gate
        run: tools/check_no_network.sh

      - name: Smoke-test the release tarball
        run: tools/smoke_test_tarball.sh

      - name: Download and verify linuxdeploy
        shell: bash
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/linuxdeploy-x86_64.AppImage"
          curl -fsSL \
            -o "$tool" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  $tool" |
            sha256sum -c -
          chmod 755 "$tool"
          echo "LINUXDEPLOY=$tool" >> "$GITHUB_ENV"

      - name: Build the AppImage
        run: tools/make_appimage.sh

      - name: Smoke-test the AppImage
        run: tools/smoke_test_appimage.sh

      - name: Generate and verify SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          cd dist
          sha256sum \
            "slugline-$version-linux-x86_64.tar.gz" \
            "Slugline-$version-x86_64.AppImage" > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            "dist/slugline-$RELEASE_VERSION-linux-x86_64.tar.gz"
            "dist/Slugline-$RELEASE_VERSION-x86_64.AppImage"
            "dist/SHA256SUMS"
          )
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            actual_tag="$(
              gh release view "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --json tagName \
                --jq .tagName
            )"
            test "$actual_tag" = "$RELEASE_TAG"
            gh release upload "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Slugline $RELEASE_VERSION" \
              --generate-notes
          fi

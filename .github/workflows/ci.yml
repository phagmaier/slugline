name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first: CI is a gate, not a log.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Linux is the only target (§1.2), so a warning is a build failure everywhere.
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust — fmt, clippy, test, layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Layering (§2.5 — no upward crate dependencies)
        run: python3 tools/check_layering.py

      - name: The reference feature is current
        run: python3 tools/make_reference.py --check

  fuzz:
    name: Fuzz — parser and round trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `cargo-fuzz` needs nightly and instruments every dependency, which is
      # why fuzz/ is its own workspace and this is its own job: nothing here
      # touches the build the other jobs run.
      - name: Install Rust nightly
        run: rustup toolchain install nightly --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # A smoke run, not the gate. Phase 1's gate is 1M iterations, which is a
      # couple of minutes locally and is run before a phase closes; this catches
      # a regression on the commit that introduces it.
      - name: Seed the corpus
        run: |
          mkdir -p fuzz/corpus/parse fuzz/corpus/roundtrip
          cp testdata/corpus/*.fountain fuzz/corpus/parse/
          cp testdata/corpus/*.fountain fuzz/corpus/roundtrip/

      - name: Fuzz the parser
        working-directory: fuzz
        run: cargo +nightly fuzz run parse -- -runs=200000 -max_total_time=120

      - name: Fuzz the round trip
        working-directory: fuzz
        run: cargo +nightly fuzz run roundtrip -- -runs=200000 -max_total_time=120

  flutter:
    name: Flutter — analyze, test, release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Unit tests
        working-directory: app
        run: flutter test

      # This is the real gate: it proves cargokit compiles the Rust workspace
      # and bundles libslugline_bridge.so with no manual step (Phase 0).
      - name: Release build
        working-directory: app
        run: flutter build linux --release

      - name: Assert the Rust library was bundled
        working-directory: app
        run: test -f build/linux/x64/release/bundle/lib/libslugline_bridge.so

      # §1.3 budget: stripped release binary + bundle under 60 MB.
      - name: Check bundle size budget
        working-directory: app
        run: |
          bytes=$(du -sb build/linux/x64/release/bundle | cut -f1)
          echo "bundle: $((bytes / 1024 / 1024)) MB"
          test "$bytes" -lt $((60 * 1024 * 1024))

      # The bridge proofs need the real .so, so they run against the bundle
      # rather than in the unit-test job. xvfb supplies the X display the GTK
      # embedder needs on a headless runner.
      - name: Bridge integration tests
        working-directory: app
        run: |
          sudo apt-get install --no-install-recommends -y xvfb
          xvfb-run -a flutter test integration_test/bridge_test.dart -d linux

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first: CI is a gate, not a log.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Linux is the only target (§1.2), so a warning is a build failure everywhere.
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust — fmt, clippy, test, layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      # §Phase 7's text-extraction test reads an exported PDF back through
      # `pdftotext`. Without poppler the test says so and stops rather than
      # passing quietly, so this is what makes it a gate rather than a note.
      - name: Install poppler-utils
        run: sudo apt-get install --no-install-recommends -y poppler-utils

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # §Phase 4's full-disk test is only the real thing when it has a small
      # filesystem to fill; without one it falls back to proving the ENOSPC
      # classification alone. A runner has root, so give it one. 4 MB is enough
      # to fill in a fraction of a second and small enough to cost nothing.
      # mode=1777 because the test runs as the unprivileged runner user.
      - name: Mount a small filesystem for the full-disk test
        run: |
          sudo mkdir -p /mnt/slugline-full-disk
          sudo mount -t tmpfs -o size=4m,mode=1777 tmpfs /mnt/slugline-full-disk
          df -h /mnt/slugline-full-disk

      # This also runs the Rust half of the line-breaking differential test,
      # which regenerates testdata/line-breaking.json and fails if the committed
      # copy is not what layout::line_spans now produces. The Dart half is in
      # the flutter job's unit tests; a wrap that changes on one side alone
      # fails one of the two (docs/LINE_BREAKING.md).
      - name: Test
        env:
          SLUGLINE_FULL_DISK_DIR: /mnt/slugline-full-disk
        run: cargo test --workspace

      # Even when the test above failed and left its ballast behind: a cached
      # runner must never inherit a filesystem that is already full.
      - name: Unmount the small filesystem
        if: always()
        run: sudo umount /mnt/slugline-full-disk || true

      - name: Layering (§2.5 — no upward crate dependencies)
        run: python3 tools/check_layering.py

      - name: The reference feature is current
        run: python3 tools/make_reference.py --check

      # §Phase 11: one release-version source. This is what makes that true
      # rather than aspirational — Cargo, AppStream and the changelog each hold
      # a copy of pubspec.yaml's number, and this fails when one drifts.
      - name: One release version everywhere
        run: python3 tools/check_version.py

  fuzz:
    name: Fuzz — parser and round trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `cargo-fuzz` needs nightly and instruments every dependency, which is
      # why fuzz/ is its own workspace and this is its own job: nothing here
      # touches the build the other jobs run.
      - name: Install Rust nightly
        run: rustup toolchain install nightly --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # A smoke run, not the gate. Phase 1's gate is 1M iterations, which is a
      # couple of minutes locally and is run before a phase closes; this catches
      # a regression on the commit that introduces it.
      - name: Seed the corpus
        run: |
          mkdir -p fuzz/corpus/parse fuzz/corpus/roundtrip
          cp testdata/corpus/*.fountain fuzz/corpus/parse/
          cp testdata/corpus/*.fountain fuzz/corpus/roundtrip/

      - name: Fuzz the parser
        working-directory: fuzz
        run: cargo +nightly fuzz run parse -- -runs=200000 -max_total_time=120

      - name: Fuzz the round trip
        working-directory: fuzz
        run: cargo +nightly fuzz run roundtrip -- -runs=200000 -max_total_time=120

  flutter:
    name: Flutter — analyze, test, release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          # Exact, not `flutter-version-file`: that option requires pubspec's
          # `environment.flutter` to be one exact version, while pubspec states
          # the *minimum* supported SDK so newer local toolchains keep working.
          # This pin is the supported release toolchain; bump it deliberately.
          flutter-version: "3.44.8"
          cache: true

      - name: Resolve packages
        working-directory: app
        run: flutter pub get

      # Cargokit's vendored build tool is a separate Dart package. A developer
      # checkout normally has its package config from the first Linux build,
      # but a fresh CI checkout does not, and the root `flutter pub get` cannot
      # resolve imports inside this nested package for `flutter analyze`.
      - name: Resolve Cargokit build-tool packages
        working-directory: app/rust_builder/cargokit/build_tool
        run: dart pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      # Includes the editor half of the line-breaking differential test, which
      # wraps every case in testdata/line-breaking.json with the editor's own
      # wrapText and compares boundaries. It needs the repository, not the .so,
      # so it belongs here rather than with the integration tests.
      - name: Unit tests
        working-directory: app
        run: flutter test

      # This is the real gate: it proves cargokit compiles the Rust workspace
      # and bundles libslugline_bridge.so with no manual step (Phase 0).
      - name: Release build
        working-directory: app
        run: flutter build linux --release

      - name: Assert the Rust library was bundled
        working-directory: app
        run: test -f build/linux/x64/release/bundle/lib/libslugline_bridge.so

      # §1.3 budget: stripped release binary + bundle under 60 MB.
      - name: Check bundle size budget
        working-directory: app
        run: |
          bytes=$(du -sb build/linux/x64/release/bundle | cut -f1)
          echo "bundle: $((bytes / 1024 / 1024)) MB"
          test "$bytes" -lt $((60 * 1024 * 1024))

      # The bridge proofs need the real .so, so they run against the bundle
      # rather than in the unit-test job. xvfb supplies the X display the GTK
      # embedder needs on a headless runner. Every integration test in
      # app/integration_test/ runs here — all seven, each its own step so a
      # failure names itself, and none of them tolerated (no continue-on-error).
      - name: Install xvfb
        run: sudo apt-get install --no-install-recommends -y xvfb

      - name: Bridge integration tests
        working-directory: app
        run: xvfb-run -a flutter test integration_test/bridge_test.dart -d linux

      # Phase 2: the whole chain, from a keystroke to the Fountain the core
      # would write.
      - name: Editor integration tests
        working-directory: app
        run: xvfb-run -a flutter test integration_test/editor_test.dart -d linux

      # Phase 3: a whole scene typed on the keyboard alone, against the real
      # core. This is the suite that caught the completion popup stealing Enter.
      - name: Writing workflow integration tests
        working-directory: app
        run: xvfb-run -a flutter test integration_test/writing_test.dart -d linux

      # ADR 0005's exit gate as far as automation reaches it: the values a real
      # input method sends, handed to the surface. Not a substitute for the
      # manual ibus + CJK session, which is still owed.
      - name: IME integration tests
        working-directory: app
        run: xvfb-run -a flutter test integration_test/ime_test.dart -d linux

      # Phase 4 end to end: save, reopen, recover, back up, restore.
      - name: Persistence integration tests
        working-directory: app
        run: xvfb-run -a flutter test integration_test/persistence_test.dart -d linux

      # Phase 7 end to end: paginate, edit a title page, export a PDF, and be
      # refused the two destinations an export must refuse.
      - name: Export integration tests
        working-directory: app
        run: xvfb-run -a flutter test integration_test/export_test.dart -d linux

      # §1.3: keystroke → glyph, p99 under 16 ms on the 120-page reference
      # script. Prints the table it asserts on, so a regression says by how much.
      # Last, so nothing else is competing for the runner while it measures.
      - name: Keystroke budget
        working-directory: app
        run: xvfb-run -a flutter test integration_test/keystroke_benchmark_test.dart -d linux

  # §Phase 11. Separate from `flutter` because it wants the release bundle and
  # nothing else, and because a packaging break should name itself rather than
  # arrive as "the Flutter job failed".
  package:
    name: Package — desktop integration, network isolation, tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            desktop-file-utils appstream

      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          # Exact pin — see the note on the flutter job's setup step.
          flutter-version: "3.44.8"
      - uses: dtolnay/rust-toolchain@stable

      # The metadata is checked before anything is built: it costs seconds, and
      # a malformed desktop entry is a thing a software centre silently ignores
      # rather than reports.
      - name: Desktop entry is valid
        run: desktop-file-validate packaging/com.phagmaier.slugline.desktop

      - name: AppStream metadata is valid
        run: appstreamcli validate --no-net packaging/com.phagmaier.slugline.metainfo.xml

      - name: Release build
        working-directory: app
        run: flutter build linux --release

      # §Phase 11 asks for stripped symbols. Both halves: the Rust `.so` strips
      # via [profile.release], the runner via `-s` in linux/CMakeLists.txt. The
      # runner shipped unstripped until 1.0, so this is here to keep it that way.
      - name: Both binaries are stripped
        working-directory: app
        run: |
          for binary in build/linux/x64/release/bundle/slugline \
                        build/linux/x64/release/bundle/lib/libslugline_bridge.so; do
            file "$binary" | grep -q "not stripped" && {
              echo "$binary is not stripped"; exit 1; }
            echo "$binary: stripped"
          done

      # The command line, which has to work without a display — that is the
      # whole point of answering it in the runner rather than in Dart.
      - name: --version and --help need no display
        working-directory: app/build/linux/x64/release/bundle
        run: |
          test "$(./slugline --version)" = "slugline $(sed -n 's/^version: \([0-9.]*\).*/\1/p' ../../../../../pubspec.yaml)"
          ./slugline --help | grep -q "keyboard-driven Fountain screenplay editor"

      # §1.2's zero-network claim, as something that can fail: nothing in the
      # bundle links against curl, TLS or a resolver, and the release build runs
      # inside `unshare -rn`.
      - name: Network isolation
        run: ./tools/check_no_network.sh

      - name: Tarball
        run: ./tools/package.sh --no-build

      - name: The tarball installs and runs
        run: |
          ./dist/slugline-*/install.sh "$PWD/dist/prefix"
          test "$("$PWD/dist/prefix/bin/slugline" --version)" = "$(./app/build/linux/x64/release/bundle/slugline --version)"

      - uses: actions/upload-artifact@v4
        with:
          name: slugline-linux-x64
          path: dist/*.tar.gz

name: Feature request
description: Suggest a focused improvement to Slugline
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Slugline is maintained by one person and stays offline by design.
        **Do not include private or confidential screenplay text.**
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What writing or editing problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful version of the feature.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: How do you handle this today?
  - type: checkboxes
    id: offline
    attributes:
      label: Offline design
      options:
        - label: This proposal does not require accounts, telemetry, or runtime network access.
          required: true

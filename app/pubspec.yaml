name: slugline
description: "Fast, keyboard-driven Fountain screenplay editor."
# This is an application, not a package. It is never published to pub.dev.
publish_to: 'none'

# The version the *application* reports. `Cargo.toml` is the other half of this
# answer and the two are kept in step by hand; see `docs/DEPENDENCIES.md`.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Every entry here needs a one-line justification in `docs/DEPENDENCIES.md`, in
# the same change that adds it. §1.2: avoid large transitive trees.
dependencies:
  flutter:
    sdk: flutter
  # The compiled Rust core, built and bundled by cargokit.
  slugline_bridge:
    path: rust_builder
  # Pinned exactly to the Rust `flutter_rust_bridge` version; bump both and
  # regenerate `lib/src/rust/` in one change.
  flutter_rust_bridge: 2.12.0
  freezed_annotation: ^3.1.0
  characters: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The lint set `analysis_options.yaml` activates.
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  freezed: ^3.2.5
  build_runner: ^2.15.1

flutter:
  # Material icons are used throughout the editor chrome.
  uses-material-design: true
  # No assets and no bundled fonts: the one face this project ships is Courier
  # Prime, and it is compiled into `crates/render_pdf` rather than bundled here
  # (ADR 0032). The editor draws with the system monospace face.

name: slugline
description: "Fast, keyboard-driven Fountain screenplay editor."
# This is an application, not a package. It is never published to pub.dev.
publish_to: 'none'

# The version the *application* reports. `Cargo.toml` is the other half of this
# answer and the two are kept in step by hand; see `docs/DEPENDENCIES.md`.
version: 1.0.1+2

environment:
  sdk: ^3.12.2
  # The Linux release workflow uses this Flutter toolchain. Allow newer
  # SDKs so local analysis/tests run; CI pins its own version.
  flutter: ">=3.44.8"

# Every entry here needs a one-line justification in `docs/DEPENDENCIES.md`, in
# the same change that adds it. §1.2: avoid large transitive trees.
dependencies:
  flutter:
    sdk: flutter
  # The compiled Rust core, built and bundled by cargokit.
  slugline_bridge:
    path: rust_builder
  # Pinned exactly to the Rust `flutter_rust_bridge` version; bump both and
  # regenerate `lib/src/rust/` in one change.
  flutter_rust_bridge: 2.12.0
  freezed_annotation: ^3.1.0
  characters: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The lint set `analysis_options.yaml` activates.
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  freezed: ^3.2.5
  build_runner: ^2.15.1

flutter:
  # Material icons are used throughout the editor chrome.
  uses-material-design: true
  # The one face this project ships is Courier Prime, and the screen has to draw
  # the script in the same face the PDF prints it in — a system monospace
  # fallback is a different set of advances and a different colour on the page.
  # The files below are **symlinks into `crates/render_pdf/fonts/`**, not copies:
  # `render_pdf` compiles those same bytes in (ADR 0032), and two copies of a
  # font face is exactly the drift the PDF goldens are pinned against. There is
  # no download here and never may be; the bytes are in the repository.
  fonts:
    - family: Courier Prime
      fonts:
        - asset: fonts/CourierPrime-Regular.ttf
        - asset: fonts/CourierPrime-Bold.ttf
          weight: 700
        - asset: fonts/CourierPrime-Italic.ttf
          style: italic
        - asset: fonts/CourierPrime-BoldItalic.ttf
          weight: 700
          style: italic
